plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thedreadlorddeath.tetris'
    compileSdk 34

    defaultConfig {
        applicationId 'com.thedreadlorddeath.tetris'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/com/android/build/gradle/app-metadata.properties',
                'META-INF/LICENSE',
                'META-INF/NOTICE'
            ]
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
}
